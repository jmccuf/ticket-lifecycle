<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590"><rect width="1200" height="590" rx="20" fill="#0b1322"/><text x="40" y="43" font-family="Arial, sans-serif" font-size="14" fill="#5eead4" font-weight="700">JUSTIN  /  SECURITY-AWARE SUPPORT LAB</text><text x="40" y="94" font-family="Arial, sans-serif" font-size="34" fill="#ffffff" font-weight="700">Good tickets support good security decisions</text><text x="40" y="133" font-family="Arial, sans-serif" font-size="18" fill="#d6e1ef" font-weight="400">An extension of the help desk workflow — not a replacement for an incident response process.</text><rect x="40" y="177" width="540" height="145" rx="14" fill="#142338" stroke="#28435b"/><text x="60" y="210" font-family="Arial, sans-serif" font-size="16" fill="#5eead4" font-weight="700">01</text><text x="60" y="242" font-family="Arial, sans-serif" font-size="23" fill="#ffffff" font-weight="700">MINIMIZE DATA</text><text x="60" y="271" font-family="Arial, sans-serif" font-size="17" fill="#d6e1ef" font-weight="400">Record only what is needed.</text><text x="60" y="295" font-family="Arial, sans-serif" font-size="17" fill="#d6e1ef" font-weight="400">Never include passwords or MFA codes.</text><rect x="620" y="177" width="540" height="145" rx="14" fill="#142338" stroke="#28435b"/><text x="640" y="210" font-family="Arial, sans-serif" font-size="16" fill="#5eead4" font-weight="700">02</text><text x="640" y="242" font-family="Arial, sans-serif" font-size="23" fill="#ffffff" font-weight="700">CONTROL ACCESS</text><text x="640" y="271" font-family="Arial, sans-serif" font-size="17" fill="#d6e1ef" font-weight="400">Use role-appropriate visibility.</text><text x="640" y="295" font-family="Arial, sans-serif" font-size="17" fill="#d6e1ef" font-weight="400">Check recipients and collaborators.</text><rect x="40" y="347" width="540" height="145" rx="14" fill="#142338" stroke="#28435b"/><text x="60" y="380" font-family="Arial, sans-serif" font-size="16" fill="#5eead4" font-weight="700">03</text><text x="60" y="412" font-family="Arial, sans-serif" font-size="23" fill="#ffffff" font-weight="700">ESCALATE SAFELY</text><text x="60" y="441" font-family="Arial, sans-serif" font-size="17" fill="#d6e1ef" font-weight="400">Do not open suspicious attachments.</text><text x="60" y="465" font-family="Arial, sans-serif" font-size="17" fill="#d6e1ef" font-weight="400">Assign the approved security owner.</text><rect x="620" y="347" width="540" height="145" rx="14" fill="#142338" stroke="#28435b"/><text x="640" y="380" font-family="Arial, sans-serif" font-size="16" fill="#5eead4" font-weight="700">04</text><text x="640" y="412" font-family="Arial, sans-serif" font-size="23" fill="#ffffff" font-weight="700">PRESERVE CONTEXT</text><text x="640" y="441" font-family="Arial, sans-serif" font-size="17" fill="#d6e1ef" font-weight="400">Keep timestamps and evidence references.</text><text x="640" y="465" font-family="Arial, sans-serif" font-size="17" fill="#d6e1ef" font-weight="400">Store sensitive evidence in approved systems.</text><text x="40" y="564" font-family="Arial, sans-serif" font-size="15" fill="#93a8c0" font-weight="400">ILLUSTRATION ONLY • Recommended practices; these controls have not been verified in this lab.</text></svg>
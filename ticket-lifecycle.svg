<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="625" viewBox="0 0 1200 625"><rect width="1200" height="625" rx="20" fill="#0b1322"/><text x="40" y="43" font-family="Arial, sans-serif" font-size="14" fill="#5eead4" font-weight="700">JUSTIN  /  SECURITY-AWARE SUPPORT LAB</text><text x="40" y="94" font-family="Arial, sans-serif" font-size="34" fill="#ffffff" font-weight="700">A clear path from request to resolution</text><text x="40" y="133" font-family="Arial, sans-serif" font-size="18" fill="#d6e1ef" font-weight="400">Workflow stages — not a mandatory sequence of osTicket status names.</text><rect x="40" y="175" width="350" height="144" rx="14" fill="#142338" stroke="#28435b"/><text x="60" y="208" font-family="Arial, sans-serif" font-size="16" fill="#5eead4" font-weight="700">01</text><text x="60" y="240" font-family="Arial, sans-serif" font-size="23" fill="#ffffff" font-weight="700">INTAKE</text><text x="60" y="269" font-family="Arial, sans-serif" font-size="17" fill="#d6e1ef" font-weight="400">Record symptoms and impact.</text><text x="60" y="293" font-family="Arial, sans-serif" font-size="17" fill="#d6e1ef" font-weight="400">Keep secrets out of the ticket.</text><rect x="425" y="175" width="350" height="144" rx="14" fill="#142338" stroke="#28435b"/><text x="445" y="208" font-family="Arial, sans-serif" font-size="16" fill="#5eead4" font-weight="700">02</text><text x="445" y="240" font-family="Arial, sans-serif" font-size="23" fill="#ffffff" font-weight="700">TRIAGE</text><text x="445" y="269" font-family="Arial, sans-serif" font-size="17" fill="#d6e1ef" font-weight="400">Assess urgency and SLA.</text><text x="445" y="293" font-family="Arial, sans-serif" font-size="17" fill="#d6e1ef" font-weight="400">Select the right help topic.</text><rect x="810" y="175" width="350" height="144" rx="14" fill="#142338" stroke="#28435b"/><text x="830" y="208" font-family="Arial, sans-serif" font-size="16" fill="#5eead4" font-weight="700">03</text><text x="830" y="240" font-family="Arial, sans-serif" font-size="23" fill="#ffffff" font-weight="700">ASSIGN</text><text x="830" y="269" font-family="Arial, sans-serif" font-size="17" fill="#d6e1ef" font-weight="400">Establish a clear owner.</text><text x="830" y="293" font-family="Arial, sans-serif" font-size="17" fill="#d6e1ef" font-weight="400">Document the handoff.</text><rect x="40" y="345" width="350" height="144" rx="14" fill="#142338" stroke="#28435b"/><text x="60" y="378" font-family="Arial, sans-serif" font-size="16" fill="#5eead4" font-weight="700">04</text><text x="60" y="410" font-family="Arial, sans-serif" font-size="23" fill="#ffffff" font-weight="700">INVESTIGATE</text><text x="60" y="439" font-family="Arial, sans-serif" font-size="17" fill="#d6e1ef" font-weight="400">Record actions and findings.</text><text x="60" y="463" font-family="Arial, sans-serif" font-size="17" fill="#d6e1ef" font-weight="400">Separate facts from assumptions.</text><rect x="425" y="345" width="350" height="144" rx="14" fill="#142338" stroke="#28435b"/><text x="445" y="378" font-family="Arial, sans-serif" font-size="16" fill="#5eead4" font-weight="700">05</text><text x="445" y="410" font-family="Arial, sans-serif" font-size="23" fill="#ffffff" font-weight="700">VERIFY</text><text x="445" y="439" font-family="Arial, sans-serif" font-size="17" fill="#d6e1ef" font-weight="400">Test the reported fix.</text><text x="445" y="463" font-family="Arial, sans-serif" font-size="17" fill="#d6e1ef" font-weight="400">Confirm acceptance when required.</text><rect x="810" y="345" width="350" height="144" rx="14" fill="#142338" stroke="#28435b"/><text x="830" y="378" font-family="Arial, sans-serif" font-size="16" fill="#5eead4" font-weight="700">06</text><text x="830" y="410" font-family="Arial, sans-serif" font-size="23" fill="#ffffff" font-weight="700">CLOSE &amp; FOLLOW UP</text><text x="830" y="439" font-family="Arial, sans-serif" font-size="17" fill="#d6e1ef" font-weight="400">Summarize the outcome.</text><text x="830" y="463" font-family="Arial, sans-serif" font-size="17" fill="#d6e1ef" font-weight="400">Reopen according to policy.</text><text x="40" y="549" font-family="Arial, sans-serif" font-size="20" fill="#5eead4" font-weight="400">Security concern? Escalate to the designated team and preserve relevant records.</text><text x="40" y="590" font-family="Arial, sans-serif" font-size="15" fill="#93a8c0" font-weight="400">ILLUSTRATION ONLY • Added verification steps are recommendations, not historical lab results.</text></svg>